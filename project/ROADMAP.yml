# Roadmap for the riskpath repository, managed by the AI PM (python -m riskpath pm).
project: riskpath (schedule-risk-montecarlo)

milestones:
  - id: M1
    name: CPM engine
    due: 2026-09-18
    status: done
    done_criteria:
      - Forward and backward pass with total float
      - Cycle and unknown-dependency detection
      - Hand-computed 4-task network test passes
  - id: M2
    name: Monte Carlo engine
    due: 2026-10-02
    status: done
    done_criteria:
      - PERT-beta sampler (lambda = 4) matches analytic mean
      - Vectorised per-iteration CPM over 10,000 iterations in well under 60 s
      - Criticality index per task
      - Percentile convergence test passes
  - id: M3
    name: Correlation and risk events
    due: 2026-10-16
    status: done
    done_criteria:
      - Gaussian copula with configurable rho
      - Discrete risk events (probability x days)
      - Tests show correlation widens the spread
  - id: M4
    name: Reporting and charts
    due: 2026-10-30
    status: done
    done_criteria:
      - S-curve, histogram, tornado, criticality and Gantt charts in the brand style
      - reports/schedule_risk_report.md and reports/summary.json
  - id: M5
    name: AI PM and CI automation
    due: 2026-11-13
    status: in_progress
    done_criteria:
      - Deterministic STATUS.md and status.json
      - CI on Python 3.10 and 3.12
      - Weekly AI PM workflow committing status updates
  - id: M6
    name: Estimate-quality guardrails
    due: 2026-12-11
    status: planned
    done_criteria:
      - Flag implausible ranges (pessimistic / optimistic ratio, zero-width ranges)
      - Warn when most-likely sits at a range boundary
  - id: M7
    name: MS Project XML import
    due: 2027-01-29
    status: planned
    done_criteria:
      - Parse MSPDI tasks, durations and predecessors
      - Support FS/SS/FF/SF links with lags
      - Round-trip test on a synthetic MSPDI file
  - id: M8
    name: Web UI
    due: 2027-03-26
    status: planned
    done_criteria:
      - Upload a plan and view the S-curve and criticality charts
      - Compare scenarios (rho, target date) side by side

